<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="{{SUMMARY}}" />
    <title>{{TITLE}} | Unhaine</title>
    <link
      rel="preload"
      href="assets/fonts/IBMPlexSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/IBMPlexSans-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/IBMPlexSansKR-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="blog-article-page document-page overview-page chat-enabled">
    <header class="site-header">
      <a class="brand" href="index.html">
        unhaine
        <span class="star">.</span>
      </a>
      <nav id="main-nav" class="desktop-nav">
        <a href="index.html" class="">Main</a>
        <a href="about.html" class="">About</a>
        <a href="portfolio.html" class="">Portfolio</a>
        <a href="blog.html" class="active">Blog</a>
        <a href="contact.html" class="">Contact</a>
      </nav>
      <button id="menu-toggle" class="mobile-toggle" aria-label="메뉴 열기">
        ☰
      </button>
    </header>
    <main class="site-main">
      <div class="document-layout">
        <aside class="detail-sidebar">
          <a class="detail-parent" href="blog.html">← Blog</a>
          <nav class="blog-archive" aria-label="연도별 글 목록">
            {{ARCHIVE}}
          </nav>
        </aside>
        <article
          class="detail-content blog-article"
          aria-labelledby="article-title"
        >
          <header class="detail-heading article-heading">
            <div class="article-meta">
              <span>{{CATEGORY}}</span>
              <time datetime="{{DATE}}">{{DATE_LABEL}}</time>
            </div>
            <h1 id="article-title">{{TITLE}}</h1>
            <p><em>{{SUMMARY}}</em></p>
          </header>
          <div class="article-body">
            {{BODY}}
            <footer class="article-end">
              <a class="text-link" href="blog.html">전체 글 보기 ↗</a>
            </footer>
          </div>
        </article>
      </div>
    </main>
    <footer class="site-footer">
      <span>© 2026 UNHAINE. BUILT WITH PURPOSE.</span>
      <span>SEOUL, KOREA</span>
    </footer>
    <button
      class="chat-launch"
      id="chat-launch"
      aria-label="Ask Unhaine 열기"
      aria-expanded="false"
      aria-controls="chat-panel"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4L18.4 5.6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <section class="chat-panel" id="chat-panel" aria-label="Ask Unhaine">
      <div class="chat-head">
        <svg
          class="chat-symbol"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4L18.4 5.6"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
        <button id="chat-close" class="chat-close" aria-label="닫기">×</button>
      </div>
      <div class="chat-body" id="chat-body">
        <div class="bubble bot">On Construction</div>
      </div>
      <form class="chat-form" id="chat-form">
        <textarea
          id="chat-input"
          rows="1"
          placeholder="Ask Me Anything!"
          aria-label="질문 입력"
        ></textarea>
        <div class="chat-form-actions">
          <button type="submit" aria-label="메시지 보내기">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M12 19V5m-6 6 6-6 6 6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </form>
    </section>
    <script src="background.js"></script>
    <script src="script.js"></script>
  </body>
</html>
