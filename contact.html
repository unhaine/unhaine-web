<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Unhaine — 비즈니스, 소프트웨어, AI 엔지니어링 포트폴리오"
    />
    <title>Contact | Unhaine</title>
    <link
      rel="preload"
      href="assets/fonts/IBMPlexSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/IBMPlexSans-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/IBMPlexSansKR-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="contact-page overview-page chat-enabled">
    <header class="site-header">
      <a class="brand" href="index.html">
        unhaine
        <span class="star">.</span>
      </a>
      <nav id="main-nav" class="desktop-nav">
        <a href="index.html" class="">Main</a>
        <a href="about.html" class="">About</a>
        <a href="portfolio.html" class="">Portfolio</a>
        <a href="blog.html" class="">Blog</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
      <button id="menu-toggle" class="mobile-toggle" aria-label="메뉴 열기">
        ☰
      </button>
    </header>
    <main class="site-main">
      <div class="page-heading">
        <h1>
          Exploring what’s next.
          <br />
          <em>Building it together.</em>
        </h1>
        <p class="lead">
          함께 풀어볼 문제와 새로운 기회,
          <br class="intro-break" />
          협업에 관한 이야기를 기다립니다.
        </p>
      </div>
      <section class="contact-actions" aria-label="연락 및 프로필">
        <ul class="contact-channels">
          <li class="contact-row">
            <button class="contact-address" type="button" data-copy="ultrasaram@gmail.com" aria-label="이메일 주소 복사: ultrasaram@gmail.com" title="이메일 주소 복사">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
              <span>ultrasaram@gmail.com</span>
              <span class="contact-action-icon" aria-hidden="true">
                <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="9" width="12" height="12" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
              </svg>
                <svg class="copy-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
              </span>
            </button>
          </li>
          <li class="contact-row">
            <a class="contact-address" href="https://github.com/unhaine" aria-label="GitHub: unhaine (새 탭에서 열기)" target="_blank" rel="noopener noreferrer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 19c-4.3 1.3-4.3-2.2-6-2.7M15 22v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.2-1.5 6.2-6.9A5.4 5.4 0 0 0 18.8 4a5 5 0 0 0-.1-3.5S17.5.1 15 1.8a13.4 13.4 0 0 0-7 0C5.5.1 4.3.5 4.3.5A5 5 0 0 0 4.2 4a5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.2 6.6 6.2 6.9A3.4 3.4 0 0 0 8 17.4V22" transform="translate(1 1) scale(.9)" />
              </svg>
              <span>github.com/unhaine</span>
              <span class="contact-action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
                </svg>
              </span>
            </a>
            <p class="contact-note">올려는 뒀는데… 아직 볼만한 건 없습니다…</p>
          </li>
        </ul>
        <p class="contact-copy-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer class="site-footer">
      <span>© 2026 UNHAINE. BUILT WITH PURPOSE.</span>
      <span>SEOUL, KOREA</span>
    </footer>
    <button
      class="chat-launch"
      id="chat-launch"
      aria-label="Ask Unhaine 열기"
      aria-expanded="false"
      aria-controls="chat-panel"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4L18.4 5.6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <section class="chat-panel" id="chat-panel" aria-label="Ask Unhaine">
      <div class="chat-head">
        <svg
          class="chat-symbol"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M5.6 18.4L18.4 5.6"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
        <button id="chat-close" class="chat-close" aria-label="닫기">×</button>
      </div>
      <div class="chat-body" id="chat-body">
        <div class="bubble bot">On Construction</div>
      </div>
      <form class="chat-form" id="chat-form">
        <textarea
          id="chat-input"
          rows="1"
          placeholder="Ask Me Anything!"
          aria-label="질문 입력"
        ></textarea>
        <div class="chat-form-actions">
          <button type="submit" aria-label="메시지 보내기">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M12 19V5m-6 6 6-6 6 6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </form>
    </section>
    <script src="background.js"></script>
    <script src="script.js"></script>
  </body>
</html>
