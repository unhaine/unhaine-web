<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <style>
    .wave-field {
      transform-origin: 600px 400px;
      animation: wave-drift 18s ease-in-out infinite alternate;
    }
    @keyframes wave-drift {
      from { transform: translateY(-9px) rotate(-.5deg) scale(1.02); }
      to { transform: translateY(9px) rotate(.5deg) scale(1.02); }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave-field { animation: none; }
      .spark { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="wave" x1="0" y1="400" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#215275" stop-opacity="0" />
      <stop offset=".5" stop-color="#19d7c7" stop-opacity=".42" />
      <stop offset="1" stop-color="#3783aa" stop-opacity=".65" />
    </linearGradient>
  </defs>
